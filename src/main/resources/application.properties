# Quarkus Application Configuration

# DataSource Configuration (PostgreSQL)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=todo
quarkus.datasource.password=todo_password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/tododb

# Disable Testcontainers / DevServices (User manages PostgreSQL container via compose.yaml)
quarkus.datasource.devservices.enabled=false

# Hibernate ORM Configuration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# Liquibase Configuration
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changeLog.yaml
quarkus.liquibase.clean-at-start=false
quarkus.liquibase.validate-on-migrate=true
